[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tarot"
version = "0.1.0"
description = "Tarot fortune telling MCP server and interactive client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
tarot-server = "server.__main__:main"
tarot-client = "client.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*"]
