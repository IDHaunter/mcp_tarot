# Copy to client.yaml and adjust values.

llm:
  base_url: "https://my-llm-provider.com/v1"
  api_key: ""  # or set OPENAI_API_KEY environment variable
  model: "gemma4:31b"
  temperature: 0.7
  timeout_seconds: 120.0
  system_prompt: >
    You are a thoughtful tarot reader. Interpret cards with empathy and clarity.
    Connect card meanings to the user's question. Use only the provided card data
    and pair relations. Keep a warm, conversational tone.

mcp:
  command: "python"
  args: ["-m", "server"]
  cwd: null  # defaults to project root
  env: {}

bot:
  recommended_spread_size: 3
  welcome_message: |
    Welcome to the Tarot reading bot.

    You can ask a specific question and receive guidance through the tarot cards.
    When you are ready, type your question.
