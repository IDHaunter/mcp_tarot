# Copy to client.yaml and adjust values.
# Locale strings: config/locales/en.yaml, config/locales/ru.yaml

# locale: en  # optional; default from server/data/locales.json

logging:
  level: INFO
  file: logs/client.log

llm:
  base_url: "https://my-llm-provider.com/v1"
  api_key: ""
  model: "gemma4:31b"
  temperature: 0.7
  timeout_seconds: 120.0

mcp:
  command: "python"
  args: ["-m", "server"]
  cwd: null
  env: {}

bot:
  recommended_spread_size: 3
  deck_size: 78
