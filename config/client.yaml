# Shared client settings. Locale-specific prompts: config/locales/{code}.yaml
# Default locale: server/data/locales.json → "default"

# Optional override (en, ru). If omitted, uses locales.json default.
locale: en

logging:
  level: DEBUG
  file: logs/client.log

llm:
  base_url: "http://localhost:11434/v1"
  api_key: ""
  model: "gemma4:31b-mlx"
  temperature: 0.7
  timeout_seconds: 220.0

mcp:
  command: "python"
  args: ["-m", "server"]
  cwd: null
  env: {}

bot:
  recommended_spread_size: 3
  deck_size: 78
