# Russian UI and LLM prompts (locale: ru).

llm:
  system_prompt: >
    Вы — вдумчивый таролог. Толкуйте карты с эмпатией и ясностью.
    Связывайте значения карт с вопросом пользователя. Используйте только
    предоставленные данные карт и пары взаимодействий. Не выдумывайте названия
    карт и позиции, которые пользователь не вытягивал.
    Отвечайте на русском языке, тёплым разговорным тоном.

  reading_prompt: |
    Вопрос пользователя: {question}

    Данные карт:
    {card_data}

    Дайте цельное толкование таро на этот вопрос, используя эти карты.
    Не раскрывайте внутренние позиции в колоде и всю перемешанную колоду.
    Называйте карты по имени и ориентации (прямая / перевёрнутая).

  follow_up_prompt: |
    Пользователь спрашивает о своём раскладе: {follow_up}
    Ответьте, опираясь на уже обсуждённые данные карт.

  clarification_prompt: |
    Пользователь запросил уточняющую карту.
    Дополнительные данные:
    {card_data}

    Объясните, как эта карта уточняет расклад.
    Не упоминайте номера позиций в колоде.

bot:
  quit_commands: ["quit", "exit", "q", "выход"]
  skip_commands: ["no", "n", "skip", "нет", "не"]

  welcome_message: |
    Добро пожаловать в бота для чтения таро.

    Вы можете задать конкретный вопрос и получить руководство через карты таро.
    Когда будете готовы, введите свой вопрос.

  question_prompt: "\nВаш вопрос: "
  empty_question_message: "Пожалуйста, введите вопрос."
  goodbye_message: "До свидания."

  select_cards_prompt: |
    Колода перемешана. Выберите разные позиции карт в колоде (числа 1–{deck_max}),
    через запятую.
    Например: 3, 17, 42
    Рекомендуется выбрать {recommended} карт для расклада.

  positions_prompt: "Позиции: "
  invalid_positions_message: "Введите корректные номера позиций от 1 до {deck_max}."

  clarification_prompt: |
    Хотите вытянуть ещё одну карту из колоды для уточнения?
    Если да, введите один номер позиции (1–{deck_max}).
    Если нет — {skip_hint}; чтобы завершить сеанс — {quit_hint};
    или задайте уточняющий вопрос о раскладе.

  clarification_input_prompt: "\n{clarification}\n> "
  new_topic_prompt: |
    Хотите гадание на другую тему?
    Введите новый вопрос, {skip_hint} — вернуться к началу, {quit_hint} — выход.
  new_topic_input_prompt: "\n{new_topic}\n> "

  no_active_reading_message: "Нет активного расклада. Начните с нового вопроса."
  invalid_position_message: "Неверная позиция. Выберите число от 1 до {deck_max}."
  draw_card_error_message: "Не удалось вытянуть карту: {error}"
  llm_error_message: |
    Не удалось получить толкование от модели: {error}
    Проверьте llm.base_url в config/client.yaml (сейчас: {base_url}).

format:
  card_label: "Карта"
  clarification_card_label: "Уточняющая карта"
  reversed_suffix: "перевёрнутая"
  label_meaning_for_today: "Сегодня"
  label_card_advice: "Совет"
  label_short: "Кратко"
  label_general: "Общее"
  label_in_love: "Любовь"
  label_in_situation: "Ситуация"
  interactions_heading: "Взаимодействия"
  clarification_interactions_heading: "Взаимодействия с раскладом"
  no_relation_text: "Связь не определена."
